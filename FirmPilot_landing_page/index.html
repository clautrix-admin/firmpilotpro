<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#111124" />
    <title>FirmPilot</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <div class="ambient ambient-a"></div>
      <div class="ambient ambient-b"></div>

      <section class="holding-card" aria-label="FirmPilot holding page">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true">FP</div>
          <div class="brand-copy">
            <p class="eyebrow">FirmPilot</p>
            <h1>Public website coming soon.</h1>
          </div>
        </div>

        <p class="message">
          This domain is active. The public website is currently being prepared.
        </p>

        <div class="meta-grid">
          <div class="meta-item">
            <span class="meta-label">Status</span>
            <span class="meta-value">Preparing launch</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Contact</span>
            <a class="meta-value link" href="mailto:hello@firmpilotpro.dev">
              hello@firmpilotpro.dev
            </a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
